aid: grade
name: Grade
description: >-
  Grade is the API for performance-based payroll, letting companies pay workers,
  creators, contractors, and AI agents based on results rather than hours worked.
  Companies push performance signals into Grade via webhooks or direct API calls
  (task completed, milestone hit, content published, views tracked, invoice
  processed), and Grade runs them against configurable payout rules — flat fees,
  tiered commissions, threshold bonuses, or blended structures — handling the
  math, de-duplication, and approval workflows automatically. Grade tracks every
  post across platforms, approves and distributes bulk payouts in one click, and
  handles compliance end to end: KYC verification, tax-form collection, DAC7
  reporting, worker classification, and merchant-of-record services. Payouts
  reach 190+ countries via local bank transfers, PayPal, Wise, Payoneer, Revolut,
  Airtm, and USDT, with no separate creator account required. Grade (YC W26) is
  based in San Francisco and has paid out $10M+ to date.
